[project]
name = "tenant-advocate"
version = "0.1.0"
description = "Tenant advocate for NYC renters (Gemini 4 NYC Hackathon)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "google-genai>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
extend-exclude = ["data", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
